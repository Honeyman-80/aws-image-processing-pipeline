AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image processing pipeline using S3, SQS, Lambda, DynamoDB, and DLQ

Parameters:
  ProjectName:
    Type: String
    Default: dave-image-processing-sam
    Description: Base name used for image processing resources

Resources:
  ImageProcessingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: dave-image-processing-sam-2026 

  ImageProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-queue"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageProcessingDLQ.Arn
        maxReceiveCount: 3
        
  ImageProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ImageProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3SendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ImageProcessingQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !GetAtt ImageProcessingBucket.Arn

  ImageProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-dlq"
  
  ImageProcessingUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"

  ImageProcessingUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-client"
      UserPoolId: !Ref ImageProcessingUserPool
      GenerateSecret: false

  ImageProcessingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ImageProcessingUserPool.Arn

  ImageProcessingRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-records-v2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: image_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: image_id
          KeyType: RANGE

  ImageProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-function"
      Runtime: python3.13
      Handler: app.lambda_handler
      CodeUri: ../../src/process_image/
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Sub "${ProjectName}-records-v2"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageProcessingRecordsTable
        - S3ReadPolicy:
            BucketName: !Ref ImageProcessingBucket
      Events:
        QueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageProcessingQueue.Arn
            BatchSize: 1 

  GetRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-get-records-function"
      Runtime: python3.13
      Handler: app.lambda_handler
      CodeUri: ../../src/get_records/
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Sub "${ProjectName}-records-v2"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "${ProjectName}-records-v2"
      Events:
        GetRecordsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImageProcessingApi
            Path: /records
            Method: GET
