AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image processing pipeline using S3, SQS, Lambda, DynamoDB, and DLQ

Resources:
  ImageProcessingBucket:
    Type: AWS::S3::Bucket

  ImageProcessingQueue:
    Type: AWS::SQS::Queue

  ImageProcessingDLQ:
    Type: AWS::SQS::Queue

  ImageProcessingRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: image_id
          AttributeType: S
      KeySchema:
        - AttributeName: image_id
          KeyType: HASH
